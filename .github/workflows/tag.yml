# 发版流程：先把 package.json 与 public/manifest.json 的版本改成新版本并合入 main，
# 再手动运行本工作流并输入同一个 tag（如 v1.0.2）。它会校验两处版本号、打 tag、
# 然后触发 release.yml 完成构建与发布。
name: Release Tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的版本 tag，例如 v1.0.2（main 上两处版本号必须已经是该值）"
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: tag-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  tag:
    name: Create release tag
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Validate version
        run: node scripts/check-release-version.mjs "$TAG"

      - name: Check tag does not exist
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG 已存在，不能重复发布"
            exit 1
          fi
          echo "tag $TAG 尚不存在，继续"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Trigger release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --ref main -f tag="$TAG"
